<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f2f2f4;font:13px system-ui}
.row{display:flex}.cell{width:380px;height:420px;position:relative}
.cell.dark{background:#22242b}canvas{width:380px;height:420px;display:block}
.lab{position:absolute;left:8px;top:6px;font:12px system-ui;color:#999;z-index:2}
</style></head><body><div class="row" id="row"></div>
<script type="module">
import { makeCube } from "./renderer/skins/cube.js";
const modes=[["thinking",0],["sleepy",0],["idle",1]];
const row=document.getElementById("row"),made=[];
for(const [m,dark] of modes){const d=document.createElement("div");d.className="cell"+(dark?" dark":"");
const l=document.createElement("div");l.className="lab";l.textContent=m;const c=document.createElement("canvas");
d.appendChild(c);d.appendChild(l);row.appendChild(d);made.push({m,s:makeCube(c,{})});}
(function step(){for(const {m,s} of made){s.S.mood=m;}requestAnimationFrame(step);})();
window.__m=made;
</script></body></html>
