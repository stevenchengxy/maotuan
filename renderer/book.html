<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>绘本</title>
<style>
  :root { --ink:#33303A; --soft:#6E6776; --bg:#F6F2E9; --card:#FFFDF8; --line:rgba(60,50,60,.14); --berry:#AF5164; --on:#FFF7F3; }
  @media (prefers-color-scheme: dark) { :root { --ink:#EDE7DC; --soft:#A69DAF; --bg:#221D2A; --card:#2C2634; --line:rgba(255,255,255,.1); --berry:#D8808F; --on:#2A1A1F; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  body { display:flex; flex-direction:column; }
  header { -webkit-app-region:drag; padding:14px 18px 8px 80px; display:flex; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-family:"Songti SC","STSong","SimSun",serif; font-size:20px; font-weight:600; }
  .page { flex:1; min-height:0; display:grid; grid-template-columns: 3fr 2fr; gap:16px; padding:6px 18px 16px; }
  .pic { background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .pic img { width:100%; height:100%; object-fit:cover; }
  .pic .none { color:var(--soft); font-size:14px; padding:20px; text-align:center; }
  .text { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px 24px; font-family:"Songti SC","STSong","SimSun",serif; font-size:22px; line-height:1.9; overflow:auto; display:flex; flex-direction:column; }
  .text .n { font-size:12px; color:var(--soft); font-family:-apple-system,sans-serif; letter-spacing:.1em; margin-bottom:8px; }
  .text .t { flex:1; }
  .text .t .now { background:linear-gradient(transparent 62%, rgba(240,220,168,.8) 62%); }
  footer { -webkit-app-region:no-drag; padding:0 18px 16px; display:flex; gap:10px; align-items:center; }
  button { font:inherit; color:inherit; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:8px 16px; cursor:pointer; font-size:14px; }
  button.primary { background:var(--berry); border-color:var(--berry); color:var(--on); }
  .spacer { flex:1; }
  .hint { font-size:12px; color:var(--soft); }
</style>
</head>
<body>
<header><h1 id="title">绘本</h1><span class="hint" id="meta"></span></header>
<div class="page">
  <div class="pic" id="pic"><div class="none">还没有图</div></div>
  <div class="text"><div class="n" id="pn">第 1 页</div><div class="t" id="pt"></div></div>
</div>
<footer>
  <button id="prev">上一页</button>
  <button id="next">下一页</button>
  <span class="spacer"></span>
  <button id="auto" class="primary">从这页开始讲</button>
  <button id="stop">停</button>
  <span class="hint" id="st"></span>
</footer>
<script>
const api = window.mt; const $ = id => document.getElementById(id);
let book = null, i = 0, auto = false;
function show(k) {
  if (!book) return; i = Math.max(0, Math.min(book.pages.length - 1, k)); const p = book.pages[i];
  $("pn").textContent = `第 ${i + 1} 页 / ${book.pages.length}`; $("pt").textContent = p.text;
  $("pic").innerHTML = p.image ? `<img src="file://${encodeURI(p.image).replace(/#/g, "%23")}">` : `<div class="none">${p.error ? "这页没画成：" + p.error : "还没有图"}</div>`;
  $("prev").disabled = i === 0; $("next").disabled = i === book.pages.length - 1;
}
$("prev").addEventListener("click", () => { auto = false; api.invoke("book:stop"); show(i - 1); });
$("next").addEventListener("click", () => { auto = false; api.invoke("book:stop"); show(i + 1); });
$("auto").addEventListener("click", () => { auto = true; api.invoke("book:read", { page: i }); $("st").textContent = "在讲……"; });
$("stop").addEventListener("click", () => { auto = false; api.invoke("book:stop"); $("st").textContent = ""; });
window.addEventListener("keydown", e => { if (e.key === "ArrowLeft") $("prev").click(); if (e.key === "ArrowRight") $("next").click(); if (e.key === " ") { e.preventDefault(); (auto ? $("stop") : $("auto")).click(); } });
api.on("book:data", b => { book = b; $("title").textContent = b.title; $("meta").textContent = (b.source ? "来自《" + b.source + "》 · " : "") + b.pages.length + " 页"; show(0); });
api.on("book:page", ({ page }) => { show(page); });
api.on("book:line", ({ text }) => { const t = $("pt"); const full = book.pages[i].text; const k = full.indexOf(text); if (k >= 0) t.innerHTML = full.slice(0, k) + '<span class="now">' + text + "</span>" + full.slice(k + text.length); });
api.on("book:done", () => { auto = false; $("st").textContent = "讲完啦。"; });
api.invoke("book:get").then(b => { if (b) { book = b; $("title").textContent = b.title; $("meta").textContent = b.pages.length + " 页"; show(0); } });
</script>
</body>
</html>
