<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>毛团</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; }
  body { font-family: "Songti SC", "STSong", "Noto Serif SC", -apple-system, "PingFang SC", serif; }
  #stage { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; height: 100%; display: block; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #hud { position: absolute; left: 12px; top: 10px; font: 600 13px/1.4 -apple-system, "PingFang SC", sans-serif; color: #33303A; text-shadow: 0 1px 0 rgba(255,255,255,.8); pointer-events: none; display: none; }
  @media (prefers-color-scheme: dark) { #hud { color: #EDE7DC; text-shadow: 0 1px 0 rgba(0,0,0,.6); } }
  #bubble {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    max-width: min(264px, 88%); padding: 9px 13px; border-radius: 15px;
    background: rgba(250, 247, 240, 0.96); color: #33303A;
    font-size: clamp(10.5px, 2.9vw, 14px); line-height: 1.5; letter-spacing: .01em;
    box-shadow: 0 6px 22px rgba(30, 20, 30, 0.18), 0 0 0 1px rgba(60, 50, 60, 0.08);
    opacity: 0; transition: opacity .25s ease, transform .25s ease; pointer-events: auto; cursor: pointer;
    text-wrap: pretty; word-break: break-word;
    /* 高度限制在里面那层 #btext 上：气泡的小尾巴是绝对定位的，会把 scrollHeight 撑大，量不准 */
  }
  #btext { display: block; overflow: hidden; max-height: 92px; }
  #bubble .more { color: #AF5164; font-size: .86em; white-space: nowrap; }
  @media (prefers-color-scheme: dark) { #bubble .more { color: #E2919F; } }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px;
    background: rgba(250, 247, 240, 0.96); transform: translateX(-50%) rotate(45deg); border-radius: 2px;
    box-shadow: 2px 2px 3px rgba(30, 20, 30, 0.06);
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #bubble.hide { transform: translateX(-50%) translateY(4px); }
  @media (prefers-color-scheme: dark) {
    #bubble { background: rgba(44, 38, 50, 0.96); color: #EDE7DC; box-shadow: 0 8px 26px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08); }
    #bubble::after { background: rgba(44, 38, 50, 0.96); }
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <canvas id="fx"></canvas>
  <div id="hud"></div>
  <div id="bubble"><span id="btext"></span></div>
  <script type="module" src="./pet.js"></script>
</body>
</html>
